name: Project Watchtower

concurrency:
  group: project-watchtower-server
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "core"
        type: choice
        options:
          - core
          - self
          - github-lite
          - daily
          - weekly
          - venture-check
          - venture-discover
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "31 3 * * *"

permissions:
  contents: read

jobs:
  run-server-watchtower:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "31 3 * * *" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          else
            echo "mode=core" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH key
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.WATCHTOWER_SSH_KEY }}" > ~/.ssh/watchtower
          printf '%s\n' "${{ secrets.WATCHTOWER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/watchtower
          chmod 644 ~/.ssh/known_hosts

      - name: Run on server
        shell: bash
        env:
          WATCHTOWER_HOST: ${{ secrets.WATCHTOWER_HOST }}
          WATCHTOWER_USER: ${{ secrets.WATCHTOWER_USER }}
          WATCHTOWER_PORT: ${{ secrets.WATCHTOWER_PORT }}
        run: |
          : "${WATCHTOWER_HOST:?missing WATCHTOWER_HOST}"
          : "${WATCHTOWER_USER:?missing WATCHTOWER_USER}"
          PORT="${WATCHTOWER_PORT:-22}"
          status=1
          for attempt in 1 2 3; do
            if ssh \
              -i ~/.ssh/watchtower \
              -p "$PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=5 \
              -o ServerAliveCountMax=2 \
              "$WATCHTOWER_USER@$WATCHTOWER_HOST" \
              "${{ steps.mode.outputs.mode }}" | tee watchtower-result.json; then
              python3 -c 'import json; p=json.load(open("watchtower-result.json")); s=p.get("summary",{}).get("status"); raise SystemExit(0 if s in ("ok","warn") else 75 if p.get("status")=="busy" else 1)' && exit 0
              status=$?
            else
              status=$?
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit "$status"
